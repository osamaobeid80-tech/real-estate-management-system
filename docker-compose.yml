# ============================================
# Docker Compose — تشغيل الحزمة الكاملة معًا
# نظام إدارة العقارات: PostgreSQL + Backend (Node.js/Express) + Frontend (React/Nginx)
#
# الاستخدام:
#   1) cp .env.docker.example .env.docker   (وعدّل القيم، خصوصًا كلمة مرور DB وسر JWT)
#   2) docker compose --env-file .env.docker up -d --build
#   3) افتح المتصفح على: http://localhost:8080  (الواجهة React)
#      الـ Backend يعمل خلف الكواليس على: http://localhost:4000 (اختياري للاتصال المباشر/الاختبار)
#   4) إنشاء أول مستخدم مسؤول نظام (مرة واحدة فقط):
#      docker compose exec backend npm run create-admin -- "الاسم الكامل" "admin@example.com" "StrongPass123!" "مسؤول النظام"
#
# ملاحظة: هذا الملف مستقل تمامًا عن بيئة "Static Website / RESTful Table API"
# المستخدمة في جذر المشروع (index.html, units.html, ...) — فقط لتشغيل
# مجموعة Node.js + Express + PostgreSQL + React الحقيقية في backend/ و frontend-react/.
# ============================================

services:
  # ===== قاعدة البيانات PostgreSQL =====
  db:
    image: postgres:16-alpine
    container_name: reams_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      # يُنفَّذ تلقائيًا مرة واحدة فقط عند إنشاء الحاوية لأول مرة (قاعدة بيانات فارغة)
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== خادم Backend (Node.js + Express + JWT) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reams_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-real_estate_db}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_VALUE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"

  # ===== واجهة React (مبنية وتُقدَّم عبر Nginx) =====
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: reams_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  db_data:
