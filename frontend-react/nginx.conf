# إعداد Nginx لتقديم واجهة React (SPA) داخل حاوية Docker
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # يعيد توجيه أي مسار غير موجود كملف إلى index.html (ضروري لـ React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # يمرّر طلبات /api إلى حاوية Backend داخل شبكة Docker نفسها
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ملفات ثابتة بذاكرة تخزين مؤقت أطول
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
